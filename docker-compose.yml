services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobsonar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobsonar}
      POSTGRES_DB: ${POSTGRES_DB:-jobsonar}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobsonar} -d ${POSTGRES_DB:-jobsonar}"]
      interval: 5s
      timeout: 5s
      retries: 12

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.12
    ports:
      - "${ELASTICMQ_PORT:-9324}:9324"
      - "9325:9325"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf

  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama

  web:
    profiles: ["ui"]
    image: nginx:1.27-alpine
    ports:
      - "${WEB_PORT:-3000}:80"
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  ollama_data:
