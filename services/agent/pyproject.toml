[project]
name = "jobsonar-agent"
version = "0.5.0"
description = "JobSonar local embeddings and resume parse"
requires-python = ">=3.9"
dependencies = [
    "psycopg[binary]>=3.2",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jobsonar-agent = "jobsonar_agent.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobsonar_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
