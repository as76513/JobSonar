# A browser page-navigation and an in-app fetch() can hit the identical
# path -- GET /jobs/<uuid> is both the React Router detail route and the
# API call JobDetail.jsx makes to load it. The location block below
# matches by path alone, so without this map, a direct navigation or
# refresh on /jobs/<uuid> would be proxied straight to the Go API (raw
# JSON) instead of reaching the SPA shell. Only a real browser navigation
# sends an Accept header naming text/html; fetch() does not.
map $http_accept $is_navigation {
    default 0;
    "~*text/html" 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ ^/(jobs|applications|profile|companies) {
        if ($is_navigation) {
            rewrite ^ /index.html break;
        }
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
    }
}
