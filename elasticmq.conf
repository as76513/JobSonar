include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

// Week 2: the ingestion queue for normalized jobs, plus a DLQ per NFR-4
// (poison messages must not block the worker indefinitely).
queues {
  raw-jobs-dlq {
    defaultVisibilityTimeout = 30 seconds
  }
  raw-jobs {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "raw-jobs-dlq"
      maxReceiveCount = 3
    }
  }
}
